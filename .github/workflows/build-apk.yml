name: Build & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Permet de lancer manuellement depuis GitHub

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permission pour créer des releases
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'

      - name: Get dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build APK (release)
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk artifacts/NettoyagePlus-Agent.apk

      - name: Create Release (on main/master push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          artifacts: artifacts/NettoyagePlus-Agent.apk
          tag: v${{ github.run_number }}
          name: "NettoyagePlus Agent v${{ github.run_number }}"
          body: |
            ## Téléchargement APK
            
            📱 **NettoyagePlus Agent** - Build #${{ github.run_number }}
            
            ### Installation sur Android :
            1. Téléchargez le fichier `NettoyagePlus-Agent.apk`
            2. Ouvrez le fichier sur votre téléphone
            3. Autorisez l'installation depuis des sources inconnues si demandé
            4. Installez l'application
          makeLatest: true
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
