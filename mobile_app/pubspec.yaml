name: mobile_app
description: "ERP Nettoyage Plus - Application Mobile Agent"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Auth
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0

  # State management
  provider: ^6.1.0

  # Localisation & formats
  intl: ^0.19.0
  google_fonts: ^6.2.0

  # GPS
  geolocator: ^13.0.0

  # Maps
  google_maps_flutter: ^2.10.0

  # Camera & gallery
  image_picker: ^1.1.0

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Background execution for notifications
  workmanager: ^0.9.0

  # Icônes Material supplémentaires
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/

